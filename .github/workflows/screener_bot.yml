name: IDX Stock Screener & Telegram Alert

on:
  # Jadwal Otomatis (Senin - Jumat) TEPAT SAAT JAM BURSA INDONESIA (IDX) DIBUKA
  # Konversi ke UTC (WIB = UTC + 7 jam)
  schedule:
    - cron: '5 2 * * 1-5'    # 09:05 WIB (Sesi 1 Resmi Dibuka - Evaluasi Sinyal Pagi)
    - cron: '35 6 * * 1-4'   # 13:35 WIB (Sesi 2 Resmi Dibuka Senin - Kamis)
    - cron: '5 7 * * 5'      # 14:05 WIB (Sesi 2 Resmi Dibuka Khusus Hari Jumat)
    - cron: '5 9 * * 1-5'    # 16:05 WIB (Evaluasi Akhir Penutupan Pasar / EOD)

  # Memungkinkan tombol manual "Run workflow" di website/aplikasi GitHub kapan saja
  workflow_dispatch:

jobs:
  screen-and-alert:
    name: Scan IDX Stocks & Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run IDX Momentum Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --scan
