name: IDX Stock Screener & Telegram Alert

on:
  # Jadwal Otomatis (Senin - Jumat) sesuai Jam Perdagangan Bursa Efek Indonesia (IDX)
  # Waktu dalam UTC (WIB = UTC + 7 jam)
  schedule:
    - cron: '30 2 * * 1-5'   # 09:30 WIB (Pantauan Awal Sesi 1)
    - cron: '30 4 * * 1-5'   # 11:30 WIB (Penutupan Sesi 1)
    - cron: '0 7 * * 1-5'    # 14:00 WIB (Awal Sesi 2)
    - cron: '10 9 * * 1-5'   # 16:10 WIB (Evaluasi Akhir Hari / EOD Pasar Tutup)

  # Memungkinkan tombol manual "Run workflow" di website/aplikasi GitHub kapan saja
  workflow_dispatch:

jobs:
  screen-and-alert:
    name: Scan IDX Stocks & Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run IDX Momentum Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --scan
